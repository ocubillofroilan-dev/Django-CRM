{% extends "layout.html" %}
{% block title %}Session expired{% endblock %}
{% block body %}
<main id="main" class="center-screen">
  <div class="surface surface-pad text-center card-narrow">
    <div class="empty-icon"><svg class="icon icon-lg" aria-hidden="true" focusable="false"><use href="#i-alert"/></svg></div>
    <h1 class="h3 fw-bold">Your session expired</h1>
    <p class="text-body-secondary">The form was open for too long, or cookies are blocked. Go back, reload the page and try again.</p>
    <a class="btn btn-primary" href="{% url 'home' %}">Reload</a>
  </div>
</main>
{% endblock %}
