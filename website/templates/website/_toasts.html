{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3">
  {% for message in messages %}
  <div class="toast show align-items-center border-0 text-bg-{{ message.level_tag|default:'secondary' }}"
       {% if message.level_tag == 'danger' or message.level_tag == 'warning' %}role="alert" aria-live="assertive"{% else %}role="status" aria-live="polite"{% endif %}
       aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">{{ message }}</div>
      <button type="button" class="btn-close {% if message.level_tag != 'warning' and message.level_tag != 'info' %}btn-close-white{% endif %} me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}
