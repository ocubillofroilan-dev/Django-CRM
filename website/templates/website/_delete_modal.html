<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="">
        {% csrf_token %}
        <div class="modal-body p-4">
          <div class="d-flex gap-3">
            <span class="stat-icon is-danger"><svg class="icon icon-lg" aria-hidden="true" focusable="false"><use href="#i-trash"/></svg></span>
            <div>
              <h2 class="h5 mb-1" id="deleteModalTitle">Delete this record?</h2>
              <p class="mb-0 text-body-secondary"><strong data-delete-name>this record</strong> will be permanently removed. This can't be undone.</p>
            </div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0 px-4 pb-4">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-no-loading>Cancel</button>
          <button type="submit" class="btn btn-danger">Delete</button>
        </div>
      </form>
    </div>
  </div>
</div>
